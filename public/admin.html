<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMZ BB Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f4f8fb;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:23px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.brand{font-size:25px;font-weight:900}.online{padding:8px 11px;border-radius:9px;background:#103521;color:#86efac}.card{background:#101e2e;border:1px solid #263c53;border-radius:16px;padding:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:28px;display:block;margin-top:7px}.muted{color:#91a7be}.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:13px;margin-top:13px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #24364b}th{font-size:11px;color:#91a7be}.btn{border:0;border-radius:9px;padding:10px 13px;background:#22c55e;font-weight:850}.input{width:100%;padding:12px;background:#081522;border:1px solid #263c53;color:white;border-radius:10px;margin:8px 0}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><main class="wrap" id="app"></main><script>
let pw="";const A=async u=>{let r=await fetch(u,{headers:{"x-admin-password":pw}}),d=await r.json();if(!r.ok)throw Error(d.error);return d};
function login(){document.getElementById("app").innerHTML='<div class="card" style="max-width:420px;margin:12vh auto"><h2>🛒 AMZ BB Admin</h2><p class="muted">Admin password</p><input class="input" id="p" type="password"><button class="btn" onclick="go()">Login</button></div>'}
async function go(){pw=document.getElementById("p").value;try{draw(await A("/api/admin/summary"))}catch(e){alert(e.message)}}
function draw(d){document.getElementById("app").innerHTML='<div class="top"><div class="brand">🛒 AMZ BB <span class="muted" style="font-size:13px">Admin Panel</span></div><span class="online">● Online</span></div><div class="stats"><div class="card stat"><span class="muted">Users</span><b>'+d.users+'</b></div><div class="card stat"><span class="muted">Orders</span><b>'+d.orders+'</b></div><div class="card stat"><span class="muted">Order Value</span><b>₹'+Number(d.revenue).toFixed(2)+'</b></div><div class="card stat"><span class="muted">Bulk Queue</span><b>'+d.queued+'</b></div></div><div class="grid"><div class="card"><h3>Recent Orders</h3><table><tr><th>ID</th><th>USER</th><th>AMOUNT</th><th>STATUS</th></tr>'+d.recent.map(x=>'<tr><td>#'+x.id+'</td><td>'+String(x.name||"User").replace(/</g,"&lt;")+'</td><td>₹'+x.total+'</td><td>'+x.status+'</td></tr>').join("")+'</table></div><div class="card"><h3>Quick Actions</h3><p class="muted">Users, wallet, orders and bulk queue are stored in SQLite.</p><button class="btn" onclick="users()">Users</button> <button class="btn" onclick="bulk()">Bulk Queue</button><div id="x"></div></div></div>'}
async function users(){let d=await A("/api/admin/users");document.getElementById("x").innerHTML="<hr><h3>Users</h3>"+d.users.map(u=>"<div style='padding:8px 0;border-bottom:1px solid #24364b'>#"+u.id+" "+(u.name||"User")+" — ₹"+u.balance+"</div>").join("")}
async function bulk(){let d=await A("/api/admin/bulk");document.getElementById("x").innerHTML="<hr><h3>Bulk Queue</h3>"+d.bulk.map(x=>"<div style='padding:8px 0;border-bottom:1px solid #24364b'>#"+x.id+" — "+x.status+"</div>").join("")}
login();
</script></body></html>
